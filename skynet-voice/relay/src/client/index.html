<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SKYNET Voice</title>
<style>
  :root { color-scheme: dark; --bg:#0b0d12; --fg:#e6e9ef; --dim:#8b94a3; --line:#242a35;
          --acc:#58a6ff; --live:#3fb950; --err:#f85149; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--fg); display:flex; flex-direction:column;
         font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { padding:14px 16px; border-bottom:1px solid var(--line); display:flex;
           align-items:center; gap:10px; }
  header h1 { font-size:14px; font-weight:600; margin:0; letter-spacing:.02em; }
  #dot { width:8px; height:8px; border-radius:50%; background:var(--dim); flex-shrink:0; }
  #dot.connected { background:var(--live); }
  #dot.error { background:var(--err); }
  #status { color:var(--dim); font-size:12px; margin-left:auto; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:85%; padding:9px 13px; border-radius:14px; font-size:15px; }
  .msg.user { align-self:flex-end; background:#1c3a5e; border-bottom-right-radius:4px; }
  .msg.assistant { align-self:flex-start; background:#1a1d24; border:1px solid var(--line);
                   border-bottom-left-radius:4px; }
  .msg.system { align-self:center; color:var(--dim); font-size:12px; background:none; }
  footer { padding:18px 16px calc(18px + env(safe-area-inset-bottom)); border-top:1px solid var(--line);
           display:flex; justify-content:center; }
  #talk { width:88px; height:88px; border-radius:50%; border:0; background:var(--acc);
          color:#04121f; font-weight:700; font-size:13px; letter-spacing:.03em;
          -webkit-user-select:none; user-select:none; touch-action:none; }
  #talk.listening { background:var(--err); animation:pulse 1.1s ease-in-out infinite; }
  #talk:disabled { opacity:.4; }
  @keyframes pulse { 0%,100%{ box-shadow:0 0 0 0 rgba(248,81,73,.5);} 50%{ box-shadow:0 0 0 14px rgba(248,81,73,0);} }
  #setup { padding:24px 16px; max-width:480px; margin:auto; text-align:center; }
  #setup code { background:#161a22; padding:2px 6px; border-radius:4px; }
</style>
</head>
<body>

<div id="setup" hidden>
  <p>No access token in this page's URL.</p>
  <p>Bookmark this page as <code>?token=&lt;RELAY_SHARED_SECRET&gt;</code> and reopen it.</p>
</div>

<div id="app" hidden style="display:flex; flex-direction:column; height:100%;">
  <header>
    <div id="dot"></div>
    <h1>SKYNET Voice</h1>
    <div id="status">connecting…</div>
  </header>
  <div id="log"></div>
  <footer>
    <button id="talk" disabled>HOLD<br>TO TALK</button>
  </footer>
</div>

<script>
(function () {
  "use strict";

  var params = new URLSearchParams(location.search);
  var token = params.get("token") || localStorage.getItem("skynet_voice_token");
  if (params.get("token")) localStorage.setItem("skynet_voice_token", params.get("token"));

  var els = {
    setup: document.getElementById("setup"),
    app: document.getElementById("app"),
    dot: document.getElementById("dot"),
    status: document.getElementById("status"),
    log: document.getElementById("log"),
    talk: document.getElementById("talk")
  };

  if (!token) {
    els.setup.hidden = false;
    return;
  }
  els.app.hidden = false;

  function addMsg(role, text) {
    var el = document.createElement("div");
    el.className = "msg " + role;
    el.textContent = text;
    els.log.appendChild(el);
    els.log.scrollTop = els.log.scrollHeight;
    return el;
  }

  function setStatus(text, cls) {
    els.status.textContent = text;
    els.dot.className = cls || "";
  }

  // ---- Playback: sequential PCM16 chunks via Web Audio, gapless ----------
  var playCtx = null;
  var nextPlayTime = 0;
  var activeSources = [];

  function ensurePlayCtx(sampleRate) {
    if (playCtx && playCtx.sampleRate === sampleRate) return playCtx;
    if (playCtx) playCtx.close();
    playCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: sampleRate });
    nextPlayTime = playCtx.currentTime;
    return playCtx;
  }

  function playChunk(int16Bytes, sampleRate) {
    var ctx = ensurePlayCtx(sampleRate);
    var int16 = new Int16Array(int16Bytes);
    var float32 = new Float32Array(int16.length);
    for (var i = 0; i < int16.length; i++) float32[i] = int16[i] / 32768;

    var buffer = ctx.createBuffer(1, float32.length, sampleRate);
    buffer.copyToChannel(float32, 0);

    var source = ctx.createBufferSource();
    source.buffer = buffer;
    source.connect(ctx.destination);

    var startAt = Math.max(nextPlayTime, ctx.currentTime);
    source.start(startAt);
    nextPlayTime = startAt + buffer.duration;
    activeSources.push(source);
    source.onended = function () {
      var idx = activeSources.indexOf(source);
      if (idx !== -1) activeSources.splice(idx, 1);
    };
  }

  function stopPlayback() {
    activeSources.forEach(function (s) { try { s.stop(); } catch (e) {} });
    activeSources = [];
    if (playCtx) nextPlayTime = playCtx.currentTime;
  }

  // ---- WebSocket ------------------------------------------------------------
  var ws = null;
  var sessionId = localStorage.getItem("skynet_voice_session") || null;
  var pendingSampleRate = 24000;
  var assistantEl = null;

  function connect() {
    setStatus("connecting…");
    var proto = location.protocol === "https:" ? "wss:" : "ws:";
    ws = new WebSocket(proto + "//" + location.host + "/ws?token=" + encodeURIComponent(token));
    ws.binaryType = "arraybuffer";

    ws.onopen = function () {
      ws.send(JSON.stringify({ type: "hello", session_id: sessionId }));
    };

    ws.onmessage = function (evt) {
      if (evt.data instanceof ArrayBuffer) {
        playChunk(evt.data, pendingSampleRate);
        return;
      }
      var msg = JSON.parse(evt.data);
      switch (msg.type) {
        case "hello":
          sessionId = msg.session_id;
          localStorage.setItem("skynet_voice_session", sessionId);
          setStatus("ready", "connected");
          els.talk.disabled = false;
          break;
        case "transcript":
          addMsg("user", msg.text);
          assistantEl = null;
          break;
        case "response_text":
          if (!assistantEl) assistantEl = addMsg("assistant", "");
          assistantEl.textContent += msg.text;
          els.log.scrollTop = els.log.scrollHeight;
          break;
        case "tts_start":
          pendingSampleRate = msg.sample_rate;
          break;
        case "tts_end":
          break;
        case "response_complete":
          assistantEl = null;
          break;
        case "interrupted":
          stopPlayback();
          addMsg("system", "(interrupted)");
          break;
        case "error":
          addMsg("system", "error: " + msg.message);
          break;
      }
    };

    ws.onclose = function () {
      setStatus("disconnected — reconnecting…", "error");
      els.talk.disabled = true;
      setTimeout(connect, 1500);
    };

    ws.onerror = function () {
      setStatus("connection error", "error");
    };
  }
  connect();

  // ---- Capture: hold-to-talk, 16kHz mono PCM16 -------------------------------
  var mediaStream = null;
  var captureCtx = null;
  var processor = null;
  var listening = false;

  async function startTalking() {
    if (listening || !ws || ws.readyState !== WebSocket.OPEN) return;
    listening = true;
    els.talk.classList.add("listening");

    if (!mediaStream) {
      mediaStream = await navigator.mediaDevices.getUserMedia({
        audio: { sampleRate: 16000, channelCount: 1, echoCancellation: true, noiseSuppression: true }
      });
    }
    if (!captureCtx) {
      captureCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
      var source = captureCtx.createMediaStreamSource(mediaStream);
      processor = captureCtx.createScriptProcessor(2048, 1, 1);
      source.connect(processor);
      processor.connect(captureCtx.destination);
      processor.onaudioprocess = function (e) {
        if (!listening || !ws || ws.readyState !== WebSocket.OPEN) return;
        var float32 = e.inputBuffer.getChannelData(0);
        var int16 = new Int16Array(float32.length);
        for (var i = 0; i < float32.length; i++) {
          var s = Math.max(-1, Math.min(1, float32[i]));
          int16[i] = s < 0 ? s * 32768 : s * 32767;
        }
        ws.send(int16.buffer);
      };
    }
    ws.send(JSON.stringify({ type: "speech_start" }));
  }

  function stopTalking() {
    if (!listening) return;
    listening = false;
    els.talk.classList.remove("listening");
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: "speech_end" }));
    }
  }

  els.talk.addEventListener("pointerdown", function (e) { e.preventDefault(); startTalking(); });
  els.talk.addEventListener("pointerup", stopTalking);
  els.talk.addEventListener("pointercancel", stopTalking);
  els.talk.addEventListener("pointerleave", stopTalking);

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) stopTalking();
  });

  setInterval(function () {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "ping" }));
  }, 25000);
})();
</script>
</body>
</html>
